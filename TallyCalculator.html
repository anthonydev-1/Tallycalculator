<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Share+Tech+Mono&display=swap">
<style>
:root {
  --page: #5d6b75;
  --body: #dfe2df;
  --body-edge: #b9beba;
  --lcd: #b9c7a4;
  --lcd-ink: #1d281b;
  --lcd-ghost: #1d281b66;
  --key: #f1f2ef;
  --key-edge: #a9aeaa;
  --key-ink: #262b2e;
  --fn: #c5cac6;
  --op: #4b5a66;
  --op-ink: #f1f2ef;
  --op-edge: #2d3841;
  --eq: #d4562a;
  --eq-edge: #8e3416;
  --focus: #1f6feb;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #1c2126;
    --body: #2c3339;
    --body-edge: #14181b;
    --lcd: #9fae8b;
    --key: #3d464d;
    --key-edge: #1a1f23;
    --key-ink: #e8ebe8;
    --fn: #333b41;
    --op: #5f7282;
    --op-edge: #2e3943;
    --focus: #6aa3ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #1c2126; --body: #2c3339; --body-edge: #14181b; --lcd: #9fae8b;
  --key: #3d464d; --key-edge: #1a1f23; --key-ink: #e8ebe8; --fn: #333b41;
  --op: #5f7282; --op-edge: #2e3943; --focus: #6aa3ff; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background: var(--page);
  font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
.calc {
  width: min(100%, 340px);
  padding: 20px 18px 22px;
  background: var(--body);
  border-radius: 22px 22px 26px 26px;
  box-shadow: 0 7px 0 var(--body-edge), 0 22px 34px #0000003a;
}
.screen {
  background: var(--lcd);
  border-radius: 6px;
  padding: 10px 14px 12px;
  margin-bottom: 20px;
  box-shadow: inset 0 3px 6px #00000040, inset 0 0 0 2px #00000014;
  font-family: "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
  color: var(--lcd-ink);
  text-align: right;
  overflow: hidden;
}
.trail {
  height: 20px;
  font-size: 15px;
  line-height: 20px;
  color: var(--lcd-ghost);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.value {
  height: 54px;
  font-size: 46px;
  line-height: 54px;
  white-space: nowrap;
}
.value.small { font-size: 34px; }
.value.tiny { font-size: 26px; }
.value.err { font-size: 26px; }
.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px 11px;
}
button {
  font: inherit;
  font-size: 23px;
  font-weight: 500;
  height: 54px;
  border: 0;
  border-radius: 9px;
  background: var(--key);
  color: var(--key-ink);
  box-shadow: 0 4px 0 var(--key-edge);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform .05s, box-shadow .05s;
}
button.fn { background: var(--fn); font-size: 20px; }
button.op { background: var(--op); color: var(--op-ink); box-shadow: 0 4px 0 var(--op-edge); }
button.op.on { background: var(--op-ink); color: var(--op); box-shadow: 0 4px 0 var(--op-edge), inset 0 0 0 2px var(--op); }
button.eq { background: var(--eq); color: #fff; box-shadow: 0 4px 0 var(--eq-edge); }
button:active, button.press { transform: translateY(3px); box-shadow: 0 1px 0 var(--key-edge); }
button.op:active, button.op.press { box-shadow: 0 1px 0 var(--op-edge); }
button.eq:active, button.eq.press { box-shadow: 0 1px 0 var(--eq-edge); }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main class="calc" aria-label="Calculator">
  <div class="screen" role="status" aria-live="polite">
    <div class="trail" id="trail"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-k="clear">AC</button>
    <button class="fn" data-k="back" aria-label="Delete last digit">&#9003;</button>
    <button class="fn" data-k="%">%</button>
    <button class="op" data-k="/" aria-label="Divide">&divide;</button>

    <button data-k="7">7</button>
    <button data-k="8">8</button>
    <button data-k="9">9</button>
    <button class="op" data-k="*" aria-label="Multiply">&times;</button>

    <button data-k="4">4</button>
    <button data-k="5">5</button>
    <button data-k="6">6</button>
    <button class="op" data-k="-" aria-label="Subtract">&minus;</button>

    <button data-k="1">1</button>
    <button data-k="2">2</button>
    <button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Add">+</button>

    <button class="fn" data-k="neg" aria-label="Change sign">+/&minus;</button>
    <button data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=" aria-label="Equals">=</button>
  </div>
</main>

<script>
(function () {
  var SYM = { '+': '+', '-': '\u2212', '*': '\u00d7', '/': '\u00f7' };
  var MAX_DIGITS = 12;

  var cur = '0';        // entry being typed (string)
  var acc = null;       // stored left operand (number)
  var op = null;        // pending operator
  var fresh = true;     // next digit starts a new entry
  var lastOp = null, lastArg = null; // for repeated "="
  var error = false;

  var elVal = document.getElementById('value');
  var elTrail = document.getElementById('trail');
  var elKeys = document.getElementById('keys');
  var opBtns = elKeys.querySelectorAll('.op');
  var clearBtn = elKeys.querySelector('[data-k="clear"]');

  function clean(n) { return parseFloat(n.toPrecision(12)); }

  function fmt(str) {
    if (error) return str;
    var neg = str[0] === '-';
    if (neg) str = str.slice(1);
    var parts = str.split('.');
    var whole = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + whole + (parts.length > 1 ? '.' + parts[1] : '');
  }

  function numToStr(n) {
    if (!isFinite(n)) return null;
    var s = String(clean(n));
    if (/e/i.test(s)) {
      var p = clean(n).toExponential(6).replace(/\.?0+e/, 'e').replace('e+', 'e');
      return p;
    }
    return s;
  }

  function render() {
    var text = fmt(cur);
    elVal.textContent = text;
    var len = text.length;
    elVal.className = 'value' + (error ? ' err' : len > 14 ? ' tiny' : len > 10 ? ' small' : '');
    var trail = '';
    if (acc !== null && op) trail = fmt(numToStr(acc)) + ' ' + SYM[op] + (fresh ? '' : ' ' + fmt(cur));
    elTrail.textContent = trail;
    opBtns.forEach(function (b) { b.classList.toggle('on', !!op && fresh && b.dataset.k === op); });
    clearBtn.textContent = (cur !== '0' && !fresh && !error) ? 'C' : 'AC';
  }

  function compute(a, b, o) {
    switch (o) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? NaN : a / b;
    }
  }

  function fail(msg) {
    error = true; cur = msg; acc = null; op = null; fresh = true;
    lastOp = null; lastArg = null;
  }

  function digit(d) {
    if (error) allClear();
    if (fresh) { cur = d; fresh = false; if (lastOp && !op) { lastOp = null; } }
    else if (cur === '0') cur = d;
    else if (cur.replace(/[-.]/g, '').length < MAX_DIGITS) cur += d;
    render();
  }

  function dot() {
    if (error) allClear();
    if (fresh) { cur = '0.'; fresh = false; }
    else if (cur.indexOf('.') === -1) cur += '.';
    render();
  }

  function operator(o) {
    if (error) return;
    if (op && !fresh) {
      var r = compute(acc, parseFloat(cur), op);
      if (isNaN(r) || !isFinite(r)) { fail('Cannot divide by 0'); render(); return; }
      acc = clean(r);
      cur = numToStr(acc);
    } else if (!op) {
      acc = parseFloat(cur);
    }
    op = o; fresh = true; lastOp = null;
    render();
  }

  function equals() {
    if (error) return;
    var r;
    if (op) {
      var b = parseFloat(cur);
      r = compute(acc, b, op);
      lastOp = op; lastArg = b;
      elTrail.textContent = fmt(numToStr(acc)) + ' ' + SYM[op] + ' ' + fmt(numToStr(b)) + ' =';
    } else if (lastOp) {
      r = compute(parseFloat(cur), lastArg, lastOp);
      elTrail.textContent = fmt(numToStr(parseFloat(cur))) + ' ' + SYM[lastOp] + ' ' + fmt(numToStr(lastArg)) + ' =';
    } else return;
    var trailKeep = elTrail.textContent;
    if (isNaN(r) || !isFinite(r)) { fail('Cannot divide by 0'); render(); return; }
    cur = numToStr(r); acc = null; op = null; fresh = true;
    render();
    elTrail.textContent = trailKeep;
  }

  function percent() {
    if (error) return;
    var v = parseFloat(cur);
    if (op && acc !== null) v = acc * v / 100; else v = v / 100;
    cur = numToStr(v); fresh = false;
    render();
  }

  function negate() {
    if (error) return;
    if (cur === '0' || cur === '0.') return;
    cur = cur[0] === '-' ? cur.slice(1) : '-' + cur;
    render();
  }

  function back() {
    if (error) { allClear(); return; }
    if (fresh) return;
    cur = cur.length <= 1 || (cur.length === 2 && cur[0] === '-') ? '0' : cur.slice(0, -1);
    if (cur === '0') fresh = false;
    render();
  }

  function allClear() {
    cur = '0'; acc = null; op = null; fresh = true;
    lastOp = null; lastArg = null; error = false;
    render();
  }

  function clearEntry() {
    if (cur !== '0' && !fresh && !error) { cur = '0'; fresh = false; render(); }
    else allClear();
  }

  function press(k) {
    if (/^[0-9]$/.test(k)) digit(k);
    else if (k === '.') dot();
    else if ('+-*/'.indexOf(k) > -1 && k.length === 1) operator(k);
    else if (k === '=') equals();
    else if (k === '%') percent();
    else if (k === 'neg') negate();
    else if (k === 'back') back();
    else if (k === 'clear') clearEntry();
  }

  elKeys.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) press(b.dataset.k);
  });

  var keyMap = { 'Enter': '=', '=': '=', 'Backspace': 'back', 'Escape': 'clear', 'Delete': 'clear', ',': '.', 'x': '*', 'X': '*' };
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = keyMap[e.key] || e.key;
    if (!/^([0-9.%+\-*\/=]|back|clear)$/.test(k)) return;
    if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName === 'BUTTON') {
      // let the focused button handle its own Enter press
      return;
    }
    e.preventDefault();
    var btn = elKeys.querySelector('[data-k="' + k + '"]');
    if (btn) { btn.classList.add('press'); setTimeout(function () { btn.classList.remove('press'); }, 100); }
    press(k);
  });

  render();
})();
</script>
</body>
</html>
